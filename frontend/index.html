<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-in Concept</title>
    <link rel="stylesheet" href="index.css">
    <!-- Optional: Use a similar Google Font like Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-container">
    <div class="signin-card">
        
        <!-- Left Section -->
        <div class="left-section">
            <img src="https://res.cloudinary.com/djme9spdc/image/upload/v1785658865/google_PNG19644_qmrkpz.png" alt=" Logo"  class="google-logo">
            <h1>Sign in</h1>
            <p>Use your Google Account</p>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div class="input-group">
                <input type="text" id="email" name="email" placeholder="Email or phone" aria-label="Email or phone">
            </div>

            <a href="#" class="link forgot-email">Forgot email?</a>

            <p class="guest-info">
                Not your computer? Use a private browsing window to sign in. 
                <a href="#" class="link">Learn more about using Guest mode</a>
            </p>

            <div class="action-buttons">
                <a href="#" class="link create-account">Create account</a>
                <button class="next-button">Next</button>
            </div>
        </div>

    </div>
</div>

</body>
</html>
