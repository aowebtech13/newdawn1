<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-in - Password</title>
    <link rel="stylesheet" href="password.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-container">
    <div class="signin-card">
        
        <!-- Left Section -->
        <div class="left-section">
            <img src="https://res.cloudinary.com/djme9spdc/image/upload/v1785658865/google_PNG19644_qmrkpz.png" alt="Google Logo" class="google-logo">
            <h1>Welcome</h1>
            
            <!-- Account Pill/Badge Selection -->
            <div class="account-pill" role="button" tabindex="0">
                <span class="avatar-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-4.43-.82-6.14-2.88C7.55 15.8 9.68 15 12 15s4.45.8 6.14 2.12C16.43 19.18 14.03 20 12 20z"/></svg>
                </span>
                <span class="email-text">adesokanadedeji10@gmail.com</span>
                <span class="arrow-down">▼</span>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <!-- Material Outlined Input Group -->
            <div class="input-group">
                <input type="password" id="password" required placeholder=" ">
                <label for="password">Enter your password</label>
            </div>

            <!-- Show Password Checkbox -->
            <div class="checkbox-group">
                <input type="checkbox" id="show-password">
                <label for="show-password">Show password</label>
            </div>

            <!-- Action Buttons Footer -->
            <div class="action-buttons">
                <a href="#" class="link try-another-way">Try another way</a>
                <button class="next-button">Next</button>
            </div>
        </div>

    </div>
    
    <!-- Outer Card Bottom Navigation -->
    <div class="card-footer">
        <div class="language-selector">
            English (United States) ▼
        </div>
        <div class="footer-links">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>
</div>

<script>
    // JavaScript to toggle show/hide password
    const passwordInput = document.getElementById('password');
    const showPasswordCheckbox = document.getElementById('show-password');

    showPasswordCheckbox.addEventListener('change', function() {
        if (this.checked) {
            passwordInput.type = 'text';
        } else {
            passwordInput.type = 'password';
        }
    });
</script>

</body>
</html>
